[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arash-trading-intelligence"
version = "28.0.0"
description = "Offline-first quantitative research, risk diagnostics, and paper-execution tooling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - project owner to define" }
authors = [{ name = "ARASH Project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
arash = "arash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
