[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arash-trading-intelligence"
version = "28.0.0"
description = "Research-driven quantitative trading intelligence, execution-aware simulation, and risk controls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - project owner to define" }
authors = [{ name = "ARASH Project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
marketstream = ["websockets>=13.0"]

[project.scripts]
arash = "arash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
