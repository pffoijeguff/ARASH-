name: ARASH quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run full local-only release gate
        run: python scripts/release_gate.py --output artifacts/release-gate-${{ matrix.python-version }}.json --pytest-timeout-seconds 240
      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arash-release-gate-python-${{ matrix.python-version }}
          path: artifacts/release-gate-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 30
