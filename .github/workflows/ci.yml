name: ARASH validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} — tests and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,marketstream]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Lint the newly added research and stream components
        run: >-
          python -m ruff check --select E4,E7,E9,F
          src/arash/data/streaming.py
          src/arash/research/streaming_features.py
          src/arash/research/pbo.py
          src/arash/research/return_statistics.py
          tests
      - name: Run checked-in regression tests
        run: python -m pytest -q tests
      - name: Verify CLI entry point
        run: python -m arash --help
      - name: Run synthetic PBO diagnostic
        run: python -m arash pbo-audit sample_data/pbo_demo_candidate_returns.json --blocks 8 --output "$RUNNER_TEMP/arash-pbo.json"
      - name: Run synthetic return-uncertainty diagnostic
        run: python -m arash return-stats sample_data/return_stats_demo.json --iterations 250 --block-length 5 --seed 17 --output "$RUNNER_TEMP/arash-return-stats.json"
      - name: Assert diagnostic output boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          pbo = json.loads((root / "arash-pbo.json").read_text(encoding="utf-8"))
          returns = json.loads((root / "arash-return-stats.json").read_text(encoding="utf-8"))
          assert pbo["status"] == "COMPLETED_DIAGNOSTIC"
          assert pbo["trade_action"] == "NONE" and pbo["execution_enabled"] is False
          assert returns["status"] == "COMPLETED_DIAGNOSTIC"
          assert returns["trade_action"] == "NONE" and returns["execution_enabled"] is False
          assert len(returns["input_sha256"]) == 64
          print("Diagnostic integration checks passed; no trading action is generated.")
          PY
