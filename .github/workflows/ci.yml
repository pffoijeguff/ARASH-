name: Source synchronization sanity check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: Python ${{ matrix.python-version }} — package and CLI smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile the staged source tree
        run: python -m compileall -q src
      - name: Verify CLI entry point
        run: python -m arash --help
